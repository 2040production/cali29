<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- =================================
         01 - CONFIGURATION DU DOCUMENT
    ================================== -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Découvrez la sélection d'accessoires CALI29.">

    <title>Accessoires | CALI29</title>


    <!-- POLICE MANROPE -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- FEUILLES DE STYLE -->

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/categories.css">
    <link rel="stylesheet" href="css/produits.css">
    <link rel="stylesheet" href="css/panier.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <!-- =================================
         02 - HEADER
    ================================== -->

    <header id="header" class="header">


        <!-- BOUTON MENU MOBILE -->

        <button
            id="menu-burger"
            class="menu-burger"
            type="button"
            aria-label="Ouvrir le menu"
            aria-controls="menu-mobile"
            aria-expanded="false"
        >
            <span class="burger-icone">☰</span>
        </button>


        <!-- LOGO -->

        <a href="index.html" class="logo">
            CALI29
        </a>


        <!-- NAVIGATION ORDINATEUR -->

        <nav class="navigation-desktop">

            <a href="index.html" class="lien-navigation">
                Accueil
            </a>


            <!-- MENU DÉROULANT BOUTIQUE -->

            <div id="boutique-dropdown" class="boutique-dropdown">

                <button
                    id="boutique-toggle"
                    class="lien-navigation boutique-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-haspopup="true"
                >
                    Boutique
                </button>


                <!-- SOUS-MENU -->

                <div class="boutique-sous-menu">

                    <a href="fleur.html">
                        Fleurs
                    </a>

                    <a href="resine.html">
                        Résines
                    </a>

                    <a href="accessoires.html">
                        Produits
                    </a>

                </div>

            </div>

        </nav>


        <!-- PANIER -->

        <a
            href="panier.html"
            id="ouvrir-panier"
            class="bouton-panier"
        >
            Panier
            <span id="nombre-articles">0</span>
        </a>


        <!-- MENU MOBILE -->

        <nav
            id="menu-mobile"
            class="menu-mobile"
            hidden
        >

            <a href="index.html">
                Accueil
            </a>

            <a href="fleur.html">
                Fleurs
            </a>

            <a href="resine.html">
                Résines
            </a>

            <a href="accessoires.html">
                Accessoires
            </a>

            <a href="panier.html">
                Mon panier
            </a>

        </nav>

    </header>


    <!-- =================================
         03 - CONTENU PRINCIPAL
    ================================== -->

    <main>


        <!-- TITRE DE LA CATÉGORIE -->

        <section
            class="page-categorie"
            id="categorie-accessoires"
            data-categorie="accessoires"
        >

            <div class="section-titre">

                <p class="section-surtitre">
                    CALI29 COLLECTION
                </p>

                <h1 class="titre-categorie">
                    PRODUITS
                </h1>

            </div>


            <!-- =================================
                 04 - CATALOGUE PRODUITS
            ================================== -->

            <div
                id="catalogue-produits"
                class="produits-container"
            >
                <!-- Cartes générées automatiquement depuis js/produits.js -->
            </div>

        </section>

    </main>


    <!-- =================================
         05 - PANIER FIXE
    ================================== -->

    <div id="panier-fixe" class="panier-fixe">

        <div class="panier-informations">

            <span>MON PANIER</span>

            <strong id="panier-total">
                0,00 €
            </strong>

        </div>

        <a
            href="panier.html"
            class="bouton-commander"
        >
            Voir mon panier
        </a>

    </div>


    <!-- =================================
         06 - FOOTER
    ================================== -->

    <footer class="footer">

        <div class="footer-logo">
            CALI29
        </div>

        <nav class="footer-liens">

            <a href="index.html">Accueil</a>
            <a href="fleur.html">Fleurs</a>
            <a href="resine.html">Résines</a>
            <a href="accessoires.html">Produits</a>
            <a href="#">Contact</a>

        </nav>

        <p class="footer-copyright">
            © 2026 CALI29 - Tous droits réservés.
        </p>

    </footer>


    <!-- =================================
         07 - JAVASCRIPT
    ================================== -->

    <script src="js/menu.js" defer></script>
    <script src="js/acces.js" defer></script>
    <script src="js/produits.js" defer></script>
    <script src="js/catalogue.js" defer></script>
    <script src="js/panier.js" defer></script>
    <script src="js/commande.js" defer></script>

</body>

</html>
